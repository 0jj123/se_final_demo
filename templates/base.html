<!doctype html>
<html lang="zh-Hant">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>{% block title %}管院空間與排課系統{% endblock %}</title>
	<style>
		body { font-family: system-ui, sans-serif; margin: 0; background: #f6f7f9; }
		nav { background: #1f3a5f; padding: 12px 20px; display: flex; gap: 16px; align-items: center; }
		nav a { color: #fff; text-decoration: none; }
		nav .right { margin-left: auto; color: #fff; }
		main { max-width: 1100px; margin: 24px auto; padding: 0 16px; }
	</style>
	{% block head %}{% endblock %}
</head>
<body>
<nav>
	<a href="/">首頁</a>
	<a href="/space/">空間查詢</a>
	<a href="/booking/">預約借用</a>
	<a href="/schedule/">排課</a>
	<span class="right">
		{% if user %}{{ user.username }}（{{ user.role }}） <a href="/logout">登出</a>
		{% else %}<a href="/login">登入</a>{% endif %}
	</span>
</nav>
<main>
{% block content %}{% endblock %}
</main>
{% block scripts %}{% endblock %}
</body>
</html>
